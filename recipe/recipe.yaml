schema_version: 1

context:
  version: "40.53.0"

package:
  name: faker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/faker/faker-${{ version }}.tar.gz
  sha256: 8d9d2e572aaa4c03a342216a7c4f63b82ee823fe2b0594378eee37f1250b982e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faker=faker.cli:execute_from_command_line

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - faker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - faker --help

about:
  summary: Faker is a Python package that generates fake data for you.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/joke2k/faker
  documentation: http://faker.rtfd.org/

extra:
  recipe-maintainers:
    - ocefpaf
