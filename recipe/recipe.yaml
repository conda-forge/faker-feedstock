schema_version: 1

context:
  version: "40.52.0"

package:
  name: faker
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/faker/faker-${{ version }}.tar.gz
  sha256: a57e48f8e9430917a75d7b53a1568dd10cf4f442058c1fab8a4253c81b2a745a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - faker=faker.cli:execute_from_command_line

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - faker
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - faker --help

about:
  summary: Faker is a Python package that generates fake data for you.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/joke2k/faker
  documentation: http://faker.rtfd.org/

extra:
  recipe-maintainers:
    - ocefpaf
